<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Connect Chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: .5rem; margin: .5rem 0; border-radius: 6px; }
    .sys { color: #888; font-style: italic; }
    input, button { padding: .5rem; }
    #msg { width: 70%; }
  </style>
</head>
<body>
  <h2>Secure Connect – Real-Time Chat</h2>
  <p>Login via Postman (<code>POST /api/auth/login</code>) and paste the JWT here.</p>
  <input id="token" placeholder="JWT token" size="50" />
  <input id="room" value="general" size="10" />
  <button id="connect">Connect</button>
  <div id="log"></div>
  <input id="msg" placeholder="Type a message" disabled />
  <button id="send" disabled>Send</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const log = (text, cls = '') => {
      const d = document.createElement('div');
      d.className = cls; d.textContent = text;
      $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
    };
    let socket;

    $('connect').onclick = () => {
      socket = io({ auth: { token: $('token').value.trim() } });
      socket.on('connect', () => {
        log('Connected', 'sys');
        socket.emit('joinRoom', $('room').value || 'general');
        $('msg').disabled = $('send').disabled = false;
      });
      socket.on('connect_error', (e) => log('Error: ' + e.message, 'sys'));
      socket.on('systemMessage', (m) => log(m, 'sys'));
      socket.on('chatMessage', (m) => log(`${m.username}: ${m.text}`));
      socket.on('typing', (u) => log(`${u} is typing...`, 'sys'));
    };
    const send = () => { if ($('msg').value) { socket.emit('chatMessage', $('msg').value); $('msg').value = ''; } };
    $('send').onclick = send;
    $('msg').onkeydown = (e) => e.key === 'Enter' ? send() : socket.emit('typing');
  </script>
</body>
</html>
